plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
// ⚡ '!' (0x21) 是最小 ASCII 可打印字符,确保 JAR 在 classpath 中排最前
// 产物: !0000_gtocutcorners-1.2.0beta.jar, 在 gtonativelib-1.0.jar (0x67='g') 之前加载
base { archivesName = "!0000_${mod_id}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client { property 'forge.enabledGameTestNamespaces', mod_id }
        server { property 'forge.enabledGameTestNamespaces', mod_id; args '--nogui' }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// ---------------------------------------------------------------------------
// GTO dependency staging (build-time only, paths passed via -P flags).
//
// GTOCore bundles patched gtceu/gtolib/AE2/gtmthings under META-INF/jarjar.
// They are already deobfuscated (Mojang names), so they only need unpacking --
// no fg.deobf step. Runtime-only jars (LDLib, Architectury, Botania,
// KotlinForForge) are copied from the local test instance so the exact shipped
// versions are what we compile against. None of this is committed: pass
// -Pgtocore_jar=... -Pgto_instance_dir=... on the command line.
// ---------------------------------------------------------------------------
def gtoDepsDir = layout.buildDirectory.dir('gtodeps')
def gtocoreJar = file(project.findProperty('gtocore_jar') ?: 'UNKNOWN')
def gtoInstanceDir = file(project.findProperty('gto_instance_dir') ?: 'UNKNOWN')

tasks.register('extractGtoDeps') {
    description = 'Unpack GTOCore jar-in-jar dependencies used as compile-only deps.'
    group = 'gto'

    inputs.file(gtocoreJar)
    outputs.dir(gtoDepsDir)

    doLast {
        def outDir = gtoDepsDir.get().asFile
        if (!gtocoreJar.exists()) {
            throw new GradleException("GTOCore jar not found: ${gtocoreJar}. Pass -Pgtocore_jar=<path to gtocore-forge jar>.")
        }

        outDir.mkdirs()

        // 1. jar-in-jar payloads
        def gtocoreZip = new java.util.zip.ZipFile(gtocoreJar)
        try {
            gtocoreZip.entries().each { entry ->
                if (entry.name.startsWith('META-INF/jarjar/') && entry.name.endsWith('.jar')) {
                    def target = new File(outDir, entry.name.substring('META-INF/jarjar/'.length()))
                    if (!target.exists()) {
                        gtocoreZip.getInputStream(entry).withStream { input ->
                            target.withOutputStream { output -> output << input }
                        }
                        logger.lifecycle("extractGtoDeps: ${target.name} (${target.length() / 1048576}MB)")
                    }
                }
            }
        } finally {
            gtocoreZip.close()
        }

        // 2. Runtime mod jars from the local test instance
        if (gtoInstanceDir.exists()) {
            def modsDir = new File(gtoInstanceDir, 'minecraft/mods')
            def wanted = [
                ['ldlib-forge', 'ldlib.jar'],
                ['architectury', 'architectury.jar'],
                ['Botania-1.20.1', 'botania.jar'],
                ['kotlinforforge', 'kotlinforforge.jar'],
            ]
            if (modsDir.exists()) {
                modsDir.listFiles()?.each { f ->
                    wanted.each { pair ->
                        if (f.name.startsWith(pair[0]) && f.name.endsWith('.jar')) {
                            def target = new File(outDir, pair[1])
                            if (!target.exists()) {
                                target.bytes = f.bytes
                                logger.lifecycle("extractGtoDeps: ${f.name} -> ${pair[1]}")
                            }
                        }
                    }
                }
            }
        } else {
            logger.warn("extractGtoDeps: test instance dir missing, skipping LDLib/Architectury/Botania/KFF (${gtoInstanceDir})")
        }

        def required = ['gtceu-1.20.1-forge-1.20.1-26.7.3.jar',
                        'gtolib-forge-1.20.1-26.7.4.jar',
                        'appliedenergistics2-forge-1.20.1-15.267.4.jar',
                        'fastcollection-1.2.jar',
                        'gtmthings-forge-1.20.1-26.7.1.jar']
        required.each { name ->
            if (!new File(outDir, name).exists()) {
                throw new GradleException("extractGtoDeps: expected ${name} was not produced")
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Compile-only stubs for GTOCore's native-protected classes (com.fast.recipesearch).
// The real classes are injected at runtime by gtonativelib; the stubs exist only
// so mixins can name the types and must never be packaged into the jar.
sourceSets.create('stubs') {
    java {}
}
tasks.named('compileStubsJava', JavaCompile).configure {
    options.encoding = 'UTF-8'
    options.release = 17
}
dependencies {
    compileOnly sourceSets.stubs.output
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    maven { url "https://repo.spongepowered.org/repository/maven-public/" }
    maven { url "https://maven.parchmentmc.org" }
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // GTO stack comes from the local GTOCore distribution (extractGtoDeps above).
    compileOnly files(gtocoreJar)
    compileOnly files({ gtoDepsDir.get().asFile.listFiles()?.findAll { it.name.endsWith('.jar') } ?: [] })
    compileOnly 'it.unimi.dsi:fastutil:8.5.12'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('compileJava').configure {
    dependsOn 'extractGtoDeps', 'compileStubsJava'
}

// Package the prebuilt native DLL (built by buildNativeDll from src/main/native,
// see build.bat - MSVC-only) into the mod jar under native/, where GTOCutCorners
// extracts and loads it at runtime.
tasks.named('jar', Jar).configure {
    from(layout.buildDirectory.dir('generated/native/native')) {
        include '*.dll', '*.exp', '*.lib'
        into 'native'
    }
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties + [project: project] }
}

tasks.named('jar', Jar).configure {
        manifest {
            attributes([
                    'Specification-Title'     : mod_id,
                    'Specification-Vendor'    : mod_authors,
                    'Specification-Version'   : '1',
                    'Implementation-Title'    : project.name,
                    'Implementation-Version'  : project.jar.archiveVersion,
                    'Implementation-Vendor'   : mod_authors,
                    'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    'MixinConfigs'            : 'gtocutcorners.mixins.json',
            ])
        }
    finalizedBy 'reobfJar'
}


publishing {
    publications { register('mavenJava', MavenPublication) { artifact jar } }
    repositories { maven { url "file://${project.projectDir}/mcmodsrepo" } }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
